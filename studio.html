<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Clawd studio</title>
<style>
  /* Permanent Marker (Font Diner, Apache 2.0), the latin subset Google Fonts serves, kept locally so the page
     needs no network: see assets/fonts/README.md */
  @font-face {
    font-family: 'Permanent Marker'; font-style: normal; font-weight: 400; font-display: block;
    src: url(assets/fonts/PermanentMarker-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: auto; height: auto; max-width: min(100%, 1280px); max-height: 85vh; background: #F3EBDC; }   /* size and aspect come from the format (core.js) */
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script>
  // ?progetto=<nome>: a project's sheet (progetti/<nome>/progetto.js) comes before config.js, which it overrides, and its
  // scenes come in place of the demo (below). See tools/progetti.mjs.
  const PROGETTO_NOME = new URLSearchParams(location.search).get('progetto');
  const progettoMancante = () => { window.loadError = 'Progetto inesistente: ' + PROGETTO_NOME; };
  if (PROGETTO_NOME) {
    if (!/^[A-Za-z0-9_-]+$/.test(PROGETTO_NOME)) window.loadError = 'Nome di progetto "' + PROGETTO_NOME + '" non valido';
    else document.write('<script src="progetti/' + PROGETTO_NOME + '/progetto.js" onerror="progettoMancante()"><\/script>');
  }
</script>
<script src="src/config.js"></script>
<!-- styles: one file each, registered in STYLES; pick one in config.js -->
<script src="src/styles/registry.js"></script>
<script src="src/lighting.js"></script>
<script src="src/styles/classic.js"></script>
<script src="src/styles/acquerello-leggero.js"></script>
<script src="src/styles/cozy.js"></script>
<script src="src/styles/anime.js"></script>
<script src="src/techniques/watercolor.js"></script>
<script src="src/techniques/cel.js"></script>
<script src="src/core.js"></script>
<script src="src/clawd.js"></script>
<script src="src/timeline.js"></script>
<script src="src/audio.js"></script>
<!-- reference sheets (standalone loops) -->
<script src="src/sheets.js"></script>
<!-- characters: the library (src/characters/), then one file per character, then the drawing -->
<script src="src/characters/registry.js"></script>
<script src="src/characters/shapes.js"></script>
<script src="src/characters/faces.js"></script>
<script src="src/characters/act.js"></script>
<script src="src/characters/bodies/quadruped.js"></script>
<script src="src/characters/bodies/blob.js"></script>
<script src="src/characters/bodies/crawler.js"></script>
<script src="src/characters/bodies/biped.js"></script>
<script src="src/characters/gatto.js"></script>
<script src="src/characters/mostro.js"></script>
<script src="src/characters/bruco.js"></script>
<script src="src/characters/draghetto.js"></script>
<script src="src/characters/ragazza.js"></script>
<script src="src/characters/supereroe.js"></script>
<script src="src/characters/vale.js"></script>
<script src="src/characters/mara.js"></script>
<script src="src/characters/draw.js"></script>
<script src="src/characters/modelsheets.js"></script>
<!-- your video: add a script per scene file, in order -->
<script>
  if (window.PROGETTO) for (const f of window.PROGETTO.scene || []) document.write('<script src="progetti/' + PROGETTO_NOME + '/' + f + '"><\/script>');
  else document.write('<script src="src/scenes/demo.js"><\/script>');
</script>
<script src="src/scenes/tall_example.js"></script>
<script>
  // Open studio.html?loop=emotions (or views) to scrub a standalone loop instead of the video.
  const q = new URLSearchParams(location.search).get('loop'); if (q && LOOPS[q]) window.LOOP = LOOPS[q];
</script>
</body>
</html>
